# In standalone mode each service runs on its own, without the Config,
# Discovery and Gateway services. Every module is reachable directly on its
# own port and exposes its Swagger UI at http://localhost:<port>/API/.

services:
  postgres:
    image: postgres:18
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres-init-sql
        target: /docker-entrypoint-initdb.d/create-task-manager-db.sql
  jms-io:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-io:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
    ports:
      - "8061:8061"
  jms-db:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-db:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
      - "COM_CHEMAXON_TASKMANAGER_SERVICE=http://jms-taskmanager:8068"
      - "CXN_DB_DIALECT=POSTGRESQL"
      - "CXN_DB_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      - "CXN_DB_JDBC_USER=${POSTGRES_USER}"
      - "CXN_DB_JDBC_PASSWORD=${POSTGRES_PASSWORD}"
    depends_on:
      - postgres
    ports:
      - "8062:8062"
  jms-structure:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-structure:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
    ports:
      - "8063:8063"
  jms-calculations:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-calculations:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
    ports:
      - "8064:8064"
  jms-markush:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-markush:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
    ports:
      - "8065:8065"
  jms-structurechecker:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-structurechecker:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
    ports:
      - "8066:8066"
  jms-reactor:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-reactor:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
      - "COM_CHEMAXON_TASKMANAGER_SERVICE=http://jms-taskmanager:8068"
    ports:
      - "8067:8067"
  jms-taskmanager:
    image: chemaxon.jfrog.io/cxn-docker-release/chemaxon/jms-taskmanager:${JMS_VERSION}
    environment:
      - "EUREKA_CLIENT_ENABLED=false"
      - "SPRING_CLOUD_CONFIG_ENABLED=false"
      - "CHEMAXON_LICENSE_SERVER_KEY=${LICENSE_KEY}"
      - "COM_CHEMAXON_TASKMANAGER_SERVICE_JWSDB=http://jms-db:8062"
      - "COM_CHEMAXON_TASKMANAGER_SERVICE_JWS-REACTOR=http://jms-reactor:8067"
      - "CXN_TASK_DRIVER=org.postgresql.Driver"
      - "CXN_TASK_DIALECT=org.hibernate.dialect.PostgreSQLDialect"
      - "CXN_TASK_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_TASK_DB}"
      - "CXN_TASK_JDBC_USER=${POSTGRES_USER}"
      - "CXN_TASK_JDBC_PASSWORD=${POSTGRES_PASSWORD}"
    depends_on:
      - postgres
    ports:
      - "8068:8068"

volumes:
  postgres-data:

# The base database (POSTGRES_DB) is created by the postgres image. This inline
# config adds a second database (POSTGRES_TASK_DB) for the Task Manager Service
# in the same container. It runs only on first initialization of an empty data
# directory.
configs:
  postgres-init-sql:
    content: "CREATE DATABASE ${POSTGRES_TASK_DB};"
